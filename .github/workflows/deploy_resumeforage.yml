name: Deploy ResumeForage

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          script: |
            cd /home/ubuntu/resume/ResumeForage/ResumeForage

            pwd
            ls -la

            git pull origin main

            docker compose down
            docker compose build backend
            docker compose build frontend
            docker compose up -d